(function buildControls() {

function calcMA(closes, n) {
  return closes.map((_, i) => {
    if (i < n - 1) return null;
    const s = closes.slice(i - n + 1, i + 1).reduce((a, b) => a + b, 0);
    return +(s / n).toFixed(3);
  });
}

function calcEMA(arr, n) {
  const k = 2 / (n + 1);
  const out = [];
  let prev = null;
  for (const v of arr) {
    if (prev === null) { out.push(+v.toFixed(3)); prev = v; }
    else { const e = v * k + prev * (1 - k); out.push(+e.toFixed(3)); prev = e; }
  }
  return out;
}

function calcMACD(closes) {
  const ema12 = calcEMA(closes, 12);
  const ema26 = calcEMA(closes, 26);
  const dif = ema12.map((v, i) => +(v - ema26[i]).toFixed(3));
  const dea = calcEMA(dif, 9);
  const hist = dif.map((v, i) => +(2 * (v - dea[i])).toFixed(3));
  return { dif, dea, hist };
}

function render(data) {
  const dates   = data.map(d => d.date);
  const opens   = data.map(d => d.open);
  const closes  = data.map(d => d.close);
  const highs   = data.map(d => d.high);
  const lows    = data.map(d => d.low);
  const volumes = data.map(d => d.volume);

  const candleData = data.map(d => [d.open, d.close, d.low, d.high]);
  const volData = volumes.map((v, i) => ({
    value: v,
    itemStyle: { color: closes[i] >= opens[i] ? '#ef5350' : '#26a69a' }
  }));

  // 直接读取 DOM 引用，避免 getElementById 查找错误
  const maLines = MA_CONFIG.map(cfg => {
    const n = +cfg._inp.value || cfg.n;
    const visible = cfg._cb.checked;
    return { ...cfg, n, visible, seriesName: cfg.label + '(' + n + ')', data: calcMA(closes, n) };
  });

  // 橙三角：MA5/MA10/MA15 同时上穿 MA20，MA20斜率为正（月线专属）
  const fixedMA5  = calcMA(closes, 5);
  const fixedMA10 = calcMA(closes, 10);
  const fixedMA15 = calcMA(closes, 15);
  const fixedMA20 = calcMA(closes, 20);

  const allAbove = i =>
    fixedMA5[i]  !== null && fixedMA10[i] !== null &&
    fixedMA15[i] !== null && fixedMA20[i] !== null &&
    fixedMA5[i]  > fixedMA20[i] &&
    fixedMA10[i] > fixedMA20[i] &&
    fixedMA15[i] > fixedMA20[i];


  const crossPoints  = [];
  const orangeIdxs   = [];
  for (let i = 1; i < closes.length; i++) {
    const ma20Rising = fixedMA20[i] !== null && fixedMA20[i-1] !== null && fixedMA20[i] > fixedMA20[i-1];
    if (allAbove(i) && !allAbove(i-1) && ma20Rising) {
      crossPoints.push({ value: [dates[i], +(lows[i] * 0.993).toFixed(2)] });
      orangeIdxs.push(i);
    }
  }

  const { dif, dea, hist } = calcMACD(closes);

  // 每个橙三角之后，DIF线第一个拐点 → 绿色倒三角（K线+MACD）；其后一根 → 粉色倒三角
  const greenKline      = [];
  const greenMACD       = [];
  const nextKlinePoints = [];
  for (const startIdx of orangeIdxs) {
    for (let i = startIdx + 1; i < dif.length - 1; i++) {
      if (dif[i] == null || dif[i-1] == null || dif[i+1] == null) continue;
      const isPeak   = dif[i] > dif[i-1] && dif[i] > dif[i+1];
      const isTrough = dif[i] < dif[i-1] && dif[i] < dif[i+1];
      if (isPeak || isTrough) {
        greenKline.push({ value: [dates[i], +(highs[i] * 1.007).toFixed(2)] });
        greenMACD.push({ value: [dates[i], dif[i]] });
        if (i + 1 < closes.length) {
          nextKlinePoints.push({ value: [dates[i+1], +(highs[i+1] * 1.007).toFixed(2)] });
        }
        break;
      }
    }
  }

  const crossSeries = [
    {
      name: 'MA5/10/15同时上穿MA20',
      type: 'scatter',
      xAxisIndex: 0, yAxisIndex: 0,
      data: crossPoints,
      symbol: 'triangle',
      symbolSize: 13,
      color: '#ff9800',
      itemStyle: { color: '#ff9800', opacity: 1 },
      label: { show: false },
    },
    {
      name: 'DIF拐点(K线)',
      type: 'scatter',
      xAxisIndex: 0, yAxisIndex: 0,
      data: greenKline,
      symbol: 'triangle',
      symbolRotate: 180,
      symbolSize: 12,
      color: '#39ff14',
      itemStyle: { color: '#39ff14', opacity: 1 },
      label: { show: false },
    },
    {
      name: 'DIF拐点(MACD)',
      type: 'scatter',
      xAxisIndex: 1, yAxisIndex: 1,
      data: greenMACD,
      symbol: 'triangle',
      symbolRotate: 180,
      symbolSize: 12,
      color: '#39ff14',
      itemStyle: { color: '#39ff14', opacity: 1 },
      label: { show: false },
    },
    {
      name: '绿色后一根K线',
      type: 'scatter',
      xAxisIndex: 0, yAxisIndex: 0,
      data: nextKlinePoints,
      symbol: 'triangle',
      symbolRotate: 180,
      symbolSize: 12,
      color: '#ff1493',
      itemStyle: { color: '#ff1493', opacity: 1 },
      label: { show: false },
    },
  ];
  const histData = hist.map(v => ({
    value: v,
    itemStyle: { color: v >= 0 ? '#ef5350' : '#26a69a' }
  }));

  const option = {
    backgroundColor: '#0d1117',
    animation: false,
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross', lineStyle: { color: '#555' } },
      backgroundColor: '#1c2128',
      borderColor: '#30363d',
      textStyle: { color: '#c9d1d9', fontSize: 12 },
      formatter(params) {
        if (!params.length) return '';
        const date = params[0].axisValue;
        let s = '<b>' + date + '</b><br/>';
        for (const item of params) {
          if (item.seriesName === 'K线' && Array.isArray(item.value)) {
            const [, o, c, l, h] = item.value;
            s += '开:' + o + ' 收:' + c + ' 低:' + l + ' 高:' + h + '<br/>';
          } else if (item.seriesType === 'scatter' && Array.isArray(item.value)) {
            s += item.marker + item.seriesName + '<br/>';
          } else if (item.value != null && !Array.isArray(item.value)) {
            const val = typeof item.value === 'object' ? item.value.value : item.value;
            s += item.marker + item.seriesName + ': ' + val + '<br/>';
          }
        }
        return s;
      }
    },
    axisPointer: { link: [{ xAxisIndex: 'all' }] },
    dataZoom: [
      { type: 'inside', xAxisIndex: [0, 1, 2], start: 60, end: 100, minSpan: 2 },
      {
        type: 'slider', xAxisIndex: [0, 1, 2], start: 60, end: 100,
        bottom: 2, height: 20,
        fillerColor: 'rgba(31,111,235,0.2)', borderColor: '#30363d',
        textStyle: { color: '#8b949e', fontSize: 10 },
        handleStyle: { color: '#58a6ff' }, moveHandleStyle: { color: '#58a6ff' },
      },
    ],
    grid: [
      { left: 70, right: 12, top: 12,     height: '52%' },
      { left: 70, right: 12, top: '68%',  height: '12%' },
      { left: 70, right: 12, top: '83%',  height: '10%' },
    ],
    xAxis: [
      { gridIndex: 0, data: dates, ...xAxisStyle(false) },
      { gridIndex: 1, data: dates, ...xAxisStyle(false) },
      { gridIndex: 2, data: dates, ...xAxisStyle(true) },
    ],
    yAxis: [
      { gridIndex: 0, scale: true, ...yAxisStyle(), name: '点数' },
      { gridIndex: 1, scale: true, ...yAxisStyle(), name: 'MACD', splitLine: { show: false } },
      { gridIndex: 2, scale: true, ...yAxisStyle(), name: '成交量', splitLine: { show: false } },
    ],
    legend: {
      top: 4, right: 12,
      textStyle: { color: '#8b949e', fontSize: 11 },
      itemWidth: 14, itemHeight: 10,
    },
    series: [
      {
        name: 'K线', type: 'candlestick',
        xAxisIndex: 0, yAxisIndex: 0,
        data: candleData,
        itemStyle: {
          color: '#ef5350', color0: '#26a69a',
          borderColor: '#ef5350', borderColor0: '#26a69a',
        },
      },
      ...maLines.filter(m => m.visible).map(m => ({
        name: m.seriesName,
        type: 'line',
        xAxisIndex: 0, yAxisIndex: 0,
        data: m.data,
        smooth: false, symbol: 'none',
        color: m.color,
        lineStyle: { color: m.color, width: 1.2 },
        connectNulls: false,
      })),
      {
        name: 'MACD柱', type: 'bar',
        xAxisIndex: 1, yAxisIndex: 1,
        data: histData, barWidth: '70%',
      },
      {
        name: 'DIF', type: 'line',
        xAxisIndex: 1, yAxisIndex: 1,
        data: dif, symbol: 'none',
        color: '#ffda6a',
        lineStyle: { color: '#ffda6a', width: 1.2 },
      },
      {
        name: 'DEA', type: 'line',
        xAxisIndex: 1, yAxisIndex: 1,
        data: dea, symbol: 'none',
        color: '#aecbfa',
        lineStyle: { color: '#aecbfa', width: 1.2 },
      },
      {
        name: '成交量', type: 'bar',
        xAxisIndex: 2, yAxisIndex: 2,
        data: volData, barWidth: '80%',
      },
      ...crossSeries,
    ],
  };

  chart.clear();
  chart.setOption(option);
}

function xAxisStyle(showLabel) {
  return {
    type: 'category', boundaryGap: true,
    axisLine: { lineStyle: { color: '#30363d' } },
    axisTick: { show: false },
    axisLabel: {
      show: showLabel, color: '#8b949e', fontSize: 10,
      formatter: v => v.slice(0, 7),
    },
    splitLine: { show: false },
  };
}

function yAxisStyle() {
  return {
    axisLine: { lineStyle: { color: '#30363d' } },
    axisTick: { show: false },
    axisLabel: { color: '#8b949e', fontSize: 10 },
    splitLine: { lineStyle: { color: '#21262d' } },
    nameTextStyle: { color: '#8b949e', fontSize: 10 },
  };
}

window.addEventListener('resize', () => chart.resize());

render(RAW_DATA);
</script>
</body>
</html>
